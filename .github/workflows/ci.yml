name: CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager.split('+')[0]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Check types
        run: pnpm run check

      - name: Run formatter
        run: pnpm run format

      - name: Run linters
        run: |
          set +e
          pnpm exec knip
          knip_exit_code=$?
          set -e

          if [ "$knip_exit_code" -eq 1 ] || [ "$knip_exit_code" -eq 2 ]; then
            exit "$knip_exit_code"
          fi

          pnpm exec eslint .

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Run end-to-end tests
        run: pnpm run test:e2e

  minimum-versions:
    name: Minimum peer versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager.split('+')[0]")"

      - name: Install the lowest supported tRPC and TanStack Svelte Query
        run: pnpm add --save-dev --save-exact @trpc/client@11.28.0 @trpc/server@11.28.0 @tanstack/svelte-query@6.3.11

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm run test
