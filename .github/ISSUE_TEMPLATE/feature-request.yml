name: Feature request
description: Suggest a new feature or an API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The API or behavior you have in mind. Code examples help.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Does `@trpc/tanstack-react-query` have this?
      description: This package follows the React package. Link to the upstream feature or discussion if there is one.
